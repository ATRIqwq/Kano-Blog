<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章管理后台 · Fomalhaut</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ===== 登录视图 ===== -->
<div id="view-login" class="login-wrap">
  <div class="login-card card">
    <div class="logo">✏️</div>
    <h1>文章管理后台</h1>
    <div class="sub">Fomalhaut · KanoのHome 🍭</div>
    <div class="field">
      <label>GitHub 访问令牌（Fine-grained PAT）</label>
      <input id="login-token" type="password" placeholder="github_pat_xxx" autocomplete="off">
    </div>
    <button id="login-btn" class="btn primary">登 录</button>
    <div class="tip">🔒 令牌保存在本地浏览器；需要「源码仓库」的 Contents 读写权限。<br>
      仓库配置见 <code>admin/js/config.js</code>（当前：<span id="repo-hint"></span>）。</div>
  </div>
</div>

<!-- ===== 主视图 ===== -->
<div id="view-main" style="display:none">
  <header class="topbar">
    <div class="title">📝 文章管理</div>
    <nav class="nav">
      <a href="#/list" data-nav="list">文章</a>
      <a href="#/tags" data-nav="tags">标签</a>
      <a href="#/categories" data-nav="categories">分类</a>
    </nav>
    <div class="spacer"></div>
    <button id="logout-btn" class="btn ghost sm">退出</button>
  </header>
  <main class="page-body" id="page-content"></main>
</div>

<div id="toast" class="toast"></div>

<script src="vendor/js-yaml.min.js"></script>
<script src="js/config.js"></script>
<script src="js/github-api.js"></script>
<script src="js/frontmatter.js"></script>
<script src="js/markdown.js"></script>
<script src="js/app.js"></script>
<script>document.getElementById('repo-hint').textContent = window.ADMIN_CONFIG.owner + '/' + window.ADMIN_CONFIG.repo</script>
</body>
</html>
