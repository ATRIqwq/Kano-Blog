# 博客自动构建部署（第一版）
# 推送源码到 main 分支后：构建 → 压缩 → 复制管理后台 → 部署到 GitHub Pages
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx hexo clean && npx hexo generate

      - name: Minify assets
        run: npx gulp

      - name: Copy admin app into public
        run: cp -r admin public/admin

      # 部署凭据校验：PAGES_TOKEN 缺失时给出明确提示（避免晦涩的 git exit 128）
      - name: Verify PAGES_TOKEN
        run: |
          if [ -z "${{ secrets.PAGES_TOKEN }}" ]; then
            echo "::error::PAGES_TOKEN 未配置！请到 Kano-Blog 仓库 Settings → Secrets and variables → Actions 添加 PAGES_TOKEN（一个拥有 ATRIqwq/ATRIqwq.github.io 仓库 Contents 写权限的 PAT），然后重新 Run workflow。"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: ATRIqwq/ATRIqwq.github.io   # 改为你的 Pages 仓库
          publish_branch: main
          publish_dir: ./public
